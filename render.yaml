services:
  - type: web
    name: awale-ai-backend
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /
    envVars:
      - key: AWALE_DB_PATH
        value: /var/data/awale/sessions.sqlite3
    disk:
      name: awale-sessions
      mountPath: /var/data
      sizeGB: 1
